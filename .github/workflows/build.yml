name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: 'win64_msvc2022_64'
          cache: true

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # Must come after MSVC setup: the VS developer environment sets VCPKG_ROOT
      # to Visual Studio's bundled vcpkg, and this overrides it.
      - name: Set up vcpkg
        run: |
          git clone --filter=blob:none https://github.com/microsoft/vcpkg "$env:RUNNER_TEMP\vcpkg"
          & "$env:RUNNER_TEMP\vcpkg\bootstrap-vcpkg.bat" -disableMetrics
          "VCPKG_ROOT=$env:RUNNER_TEMP\vcpkg" >> $env:GITHUB_ENV

      # The preset points CMAKE_PREFIX_PATH at C:/Qt; on the runner Qt lives elsewhere.
      - name: Configure
        run: cmake --preset msvc-release -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build/release
